<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — ParkEase</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head><body>
<nav class="navbar navbar-custom"><div class="container py-2">
<a class="navbar-brand d-flex align-items-center gap-2" href="index.html"><span class="brand-mark"><i class="bi bi-p-square-fill"></i></span><span class="brand-text">ParkEase</span></a>
<a href="index.html" class="btn btn-outline-custom btn-sm">Back to Home</a>
</div></nav>
<main class="auth-wrap"><div class="container"><div class="auth-card">
<div class="text-center mb-4"><span class="brand-mark mb-3"><i class="bi bi-unlock-fill"></i></span><h2 class="fw-bold mt-3">Welcome back</h2><p class="text-muted-custom">Login to manage your parking.</p></div>
<form onsubmit="event.preventDefault();window.location.href='dashboard.html'">
<label class="form-label fw-semibold">Email</label><input class="form-control mb-3" type="email" placeholder="you@example.com" required>
<label class="form-label fw-semibold">Password</label>
<div class="position-relative mb-3"><input id="loginPassword" class="form-control pe-5" type="password" placeholder="••••••••" required><i class="bi bi-eye position-absolute end-0 top-50 translate-middle-y me-3 password-toggle" data-password-toggle="#loginPassword"></i></div>
<div class="d-flex justify-content-between align-items-center mb-4"><label class="small"><input type="checkbox" class="form-check-input me-1"> Remember me</label><a href="#" class="small text-primary-custom">Forgot password?</a></div>
<button class="btn btn-primary-custom w-100 mb-3">Login <i class="bi bi-arrow-right ms-1"></i></button>
<div class="text-center small text-muted-custom">Don't have an account? <a href="register.html" class="fw-bold text-primary-custom">Create one</a></div>
</form>
<div class="alert alert-soft mt-4 mb-0 small"><i class="bi bi-info-circle me-1"></i> Demo login redirects directly to the dashboard.</div>
</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script></body></html>
