<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register — ParkEase</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head><body>
<nav class="navbar navbar-custom"><div class="container py-2">
<a class="navbar-brand d-flex align-items-center gap-2" href="index.html"><span class="brand-mark"><i class="bi bi-p-square-fill"></i></span><span class="brand-text">ParkEase</span></a>
<a href="index.html" class="btn btn-outline-custom btn-sm">Back to Home</a>
</div></nav>
<main class="auth-wrap"><div class="container"><div class="auth-card">
<div class="text-center mb-4"><h2 class="fw-bold">Create your account</h2><p class="text-muted-custom">Start booking parking in a few clicks.</p></div>
<form onsubmit="event.preventDefault();window.location.href='dashboard.html'">
<div class="row g-3">
<div class="col-12"><label class="form-label fw-semibold">Full Name</label><input class="form-control" required placeholder="Your full name"></div>
<div class="col-md-6"><label class="form-label fw-semibold">Email</label><input type="email" class="form-control" required placeholder="name@example.com"></div>
<div class="col-md-6"><label class="form-label fw-semibold">Mobile</label><input type="tel" class="form-control" required placeholder="91234 56789"></div>
<div class="col-12"><label class="form-label fw-semibold">Password</label><input type="password" class="form-control" required placeholder="Create a strong password"></div>
<div class="col-12"><label class="form-check"><input class="form-check-input" type="checkbox" required><span class="form-check-label small">I agree to the terms and privacy policy.</span></label></div>
<div class="col-12"><button class="btn btn-primary-custom w-100">Create Account</button></div>
</div>
</form>
<div class="text-center small text-muted-custom mt-4">Already registered? <a href="login.html" class="fw-bold text-primary-custom">Login here</a></div>
</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script></body></html>
