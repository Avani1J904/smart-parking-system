<section class="page-header"><div class="container"><div class="small-label">Checkout</div><h1 class="fw-bold mt-2 mb-2">Complete payment</h1><p class="text-muted-custom mb-0">Demo payment UI — connect your payment gateway in the backend.</p></div></section>

<div class="col-lg-7"><div class="panel"><h5 class="fw-bold mb-4">Choose Payment Method</h5>
<div class="row g-3 mb-4">
<div class="col-md-6"><label class="border rounded-4 p-3 w-100 d-flex gap-3 align-items-center"><input type="radio" name="pm" checked><span><i class="bi bi-phone fs-4 text-primary-custom"></i></span><span><strong>UPI</strong><small class="d-block text-muted-custom">Google Pay / PhonePe</small></span></label></div>
<div class="col-md-6"><label class="border rounded-4 p-3 w-100 d-flex gap-3 align-items-center"><input type="radio" name="pm"><span><i class="bi bi-credit-card fs-4 text-primary-custom"></i></span><span><strong>Card</strong><small class="d-block text-muted-custom">Visa / Mastercard</small></span></label></div>
</div>
<label class="form-label fw-semibold">UPI ID</label><input class="form-control mb-3" placeholder="name@upi">
<div class="row g-3"><div class="col-md-6"><label class="form-label fw-semibold">Name on Payment</label><input class="form-control" placeholder="Aarav Sharma"></div><div class="col-md-6"><label class="form-label fw-semibold">Phone</label><input class="form-control" placeholder="9123456789"></div></div>
<button class="btn btn-primary-custom btn-lg w-100 mt-4" data-demo-action="Payment successful. Booking PK-2026-09188 confirmed.">Pay ₹130 & Confirm Booking</button>
